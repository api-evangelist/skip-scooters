name: Skip Scooters
description: 'Skip Scooters (operated by Skip Transport / Waybots) was a San Francisco-based
  dockless shared electric scooter (micromobility) startup and one of the early operators
  permitted in San Francisco, also running fleets in Washington, D.C. Backed by Accel,
  the company wound down and its assets moved to Helbiz around 2020. It is no longer
  operating: its former consumer app and rider domains (rideskip.com is a parked
  for-sale domain, skip.com now resolves to an unrelated retailer) have no live
  developer, documentation, or API surface. This profile is retained in the API
  Evangelist network as a historical portfolio-company record; the enrichment
  pipeline found no public API to harvest.'
